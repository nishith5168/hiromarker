<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Mobile: full-screen, no pinch-zoom, fills notch area -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Avocado Gallery AR</title>

  <!-- 1. A-Frame: the 3D engine -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- 2. AR.js: adds camera + marker tracking to A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    /* Lock the page so it can't scroll, bounce or pull-to-refresh on phones */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      background: #000;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Status banner (Requirement 5) - sits below the notch / status bar */
    #status {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      padding: 10px 18px;
      border-radius: 999px;
      font: 600 clamp(13px, 3.8vw, 16px)/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      text-align: center;
      background: #34495E;                /* grey = loading */
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: background 0.3s;
      pointer-events: none;
    }
    #status.lost  { background: #C0392B; } /* red   = marker lost  */
    #status.found { background: #27AE60; } /* green = marker found */
    #status.error { background: #7F1D1D; } /* dark  = camera problem */

    /* Small hint at the bottom of the screen */
    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      max-width: calc(100vw - 32px);
      padding: 8px 14px;
      border-radius: 12px;
      font: 500 clamp(12px, 3.4vw, 14px)/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
      transition: opacity 0.4s;
    }
    #hint.hidden { opacity: 0; }
  </style>

  <script>
    // Short vibration on tap (Android; ignored silently on iPhone)
    function buzz() {
      if (navigator.vibrate) navigator.vibrate(25);
    }

    // ---------- Workshop component: ball changes colour on tap ----------
    AFRAME.registerComponent('color-change', {
      schema: {
        colors: { type: 'array', default: ['#EF2D5E', '#4CC3D9', '#FFC65D', '#7BC8A4'] }
      },
      init: function () {
        this.index = 0;
        this.el.addEventListener('click', () => {
          this.index = (this.index + 1) % this.data.colors.length;
          this.el.setAttribute('color', this.data.colors[this.index]);
          buzz();
        });
      }
    });

    // ---------- My own component: tap to show / hide another object ----------
    AFRAME.registerComponent('toggle-target', {
      schema: {
        target: { type: 'selector' }
      },
      init: function () {
        this.el.addEventListener('click', () => {
          const target = this.data.target;
          if (!target) return;
          target.setAttribute('visible', !target.getAttribute('visible'));
          buzz();
        });
      }
    });

    // ---------- Status banner: loading, marker found / lost, camera errors ----------
    AFRAME.registerComponent('marker-status', {
      init: function () {
        const banner = document.getElementById('status');
        const hint = document.getElementById('hint');

        const set = (text, state) => {
          banner.textContent = text;
          banner.className = state;
        };

        this.el.addEventListener('markerFound', () => {
          set('Exhibit found ✓', 'found');
          hint.classList.add('hidden');
        });

        this.el.addEventListener('markerLost', () => {
          set('Point your camera at the Hiro marker', 'lost');
          hint.classList.remove('hidden');
        });

        // AR.js tells us when the camera starts or fails
        window.addEventListener('camera-init', () => {
          if (!banner.classList.contains('found')) {
            set('Point your camera at the Hiro marker', 'lost');
          }
        });
        window.addEventListener('camera-error', () => {
          set('Camera blocked – allow camera access and reload', 'error');
        });
      }
    });

    // ---------- Model loading feedback (the GLB is the heaviest download) ----------
    AFRAME.registerComponent('model-status', {
      init: function () {
        const hint = document.getElementById('hint');
        hint.textContent = 'Loading exhibit…';
        this.el.addEventListener('model-loaded', () => {
          hint.textContent = 'Tap the ball or the orange button';
        });
        this.el.addEventListener('model-error', () => {
          hint.textContent = 'Model failed to load – check your connection';
        });
      }
    });

    // Fix the camera view after rotating the phone (AR.js sometimes keeps the old size)
    window.addEventListener('orientationchange', () => {
      setTimeout(() => window.dispatchEvent(new Event('resize')), 400);
    });
  </script>
</head>

<body>

  <div id="status">Starting camera…</div>
  <div id="hint">Loading exhibit…</div>

  <a-scene embedded
           vr-mode-ui="enabled: false"
           loading-screen="dotsColor: #27AE60; backgroundColor: #000000"
           renderer="antialias: false; precision: medium; logarithmicDepthBuffer: true; colorManagement: true"
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;"
           cursor="rayOrigin: mouse; fuse: false"
           raycaster="objects: .clickable; far: 50">

    <!-- 3D model (Requirement 3) - CC0, credited in README -->
    <a-assets timeout="15000">
      <a-asset-item id="avocado"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Avocado/glTF-Binary/Avocado.glb">
      </a-asset-item>
    </a-assets>

    <!-- smooth* settings reduce the shaking you see on phones -->
    <a-marker preset="hiro"
              emitevents="true"
              smooth="true"
              smoothCount="8"
              smoothTolerance="0.01"
              smoothThreshold="5"
              marker-status>

      <!-- Gallery floor -->
      <a-plane position="0 0 0" rotation="-90 0 0"
               width="1.6" height="1.6" color="#2C3E50"></a-plane>

      <!-- Display plinth -->
      <a-box position="0 0.2 0" width="0.6" height="0.4" depth="0.6"
             color="#ECF0F1"></a-box>

      <!-- The exhibit: avocado model, slowly rotating (Animation 1: rotation) -->
      <a-entity gltf-model="#avocado"
                model-status
                position="0 0.42 0"
                scale="8 8 8"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-entity>

      <!-- Two gallery columns -->
      <a-cylinder position="-0.65 0.5 -0.55" radius="0.07" height="1"
                  segments-radial="16" color="#BDC3C7"></a-cylinder>
      <a-cylinder position="0.65 0.5 -0.55" radius="0.07" height="1"
                  segments-radial="16" color="#BDC3C7"></a-cylinder>

      <!-- Beam across the columns with the gallery name -->
      <a-box position="0 1.04 -0.55" width="1.5" height="0.12" depth="0.15"
             color="#8E6E53"></a-box>
      <a-text value="THE AVOCADO GALLERY" position="0 1.04 -0.47"
              align="center" width="2" color="#FFFFFF"></a-text>

      <!-- Floating ball: bobs up and down (Animation 2: position)
           and changes colour when tapped (workshop interaction).
           Bigger than before so it's easy to hit with a finger. -->
      <a-sphere class="clickable"
                position="0.5 0.25 0.45" radius="0.16" color="#EF2D5E"
                segments-width="24" segments-height="16"
                color-change
                animation="property: position; to: 0.5 0.45 0.45; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine">
      </a-sphere>

      <!-- Info button: tap to show / hide the info panel (my own component) -->
      <a-cylinder class="clickable"
                  position="-0.5 0.06 0.45" radius="0.17" height="0.12"
                  segments-radial="24" color="#F39C12"
                  toggle-target="target: #infoPanel"
                  animation="property: scale; to: 1.08 1 1.08; dir: alternate; loop: true; dur: 900; easing: easeInOutSine">
      </a-cylinder>
      <a-text value="Tap for info" position="-0.5 0.24 0.45"
              align="center" width="1.5" color="#FFFFFF"></a-text>

      <!-- Info panel (hidden until the button is tapped) -->
      <a-entity id="infoPanel" position="0 1.45 0" visible="false">
        <a-plane width="1.5" height="0.5" color="#000000" opacity="0.75"></a-plane>
        <a-text value="Persea americana (Avocado)\nNative to Central America.\nTap the orange button to close."
                align="center" width="1.5" color="#FFFFFF" position="0 0 0.01"></a-text>
      </a-entity>

    </a-marker>

    <!-- The camera = your phone camera -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
