<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avocado Gallery AR</title>

  <!-- 1. A-Frame: the 3D engine -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- 2. AR.js: adds camera + marker tracking to A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    /* Status banner (Requirement 5) */
    #status {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 18px;
      border-radius: 999px;
      font: 600 15px system-ui, sans-serif;
      color: #fff;
      background: #C0392B;          /* red = marker lost */
      transition: background 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    #status.found {
      background: #27AE60;          /* green = marker found */
    }
  </style>

  <script>
    // ---------- Workshop component: ball changes colour on tap ----------
    AFRAME.registerComponent('color-change', {
      schema: {
        colors: { type: 'array', default: ['#EF2D5E', '#4CC3D9', '#FFC65D', '#7BC8A4'] }
      },
      init: function () {
        this.index = 0;
        this.el.addEventListener('click', () => {
          this.index = (this.index + 1) % this.data.colors.length;
          this.el.setAttribute('color', this.data.colors[this.index]);
        });
      }
    });

    // ---------- My own component: tap to show / hide another object ----------
    AFRAME.registerComponent('toggle-target', {
      schema: {
        target: { type: 'selector' }
      },
      init: function () {
        this.el.addEventListener('click', () => {
          const target = this.data.target;
          if (!target) return;
          const isVisible = target.getAttribute('visible');
          target.setAttribute('visible', !isVisible);
        });
      }
    });

    // ---------- Status banner: reacts to marker found / lost ----------
    AFRAME.registerComponent('marker-status', {
      init: function () {
        const banner = document.getElementById('status');

        this.el.addEventListener('markerFound', () => {
          banner.textContent = 'Exhibit found ✓';
          banner.classList.add('found');
        });

        this.el.addEventListener('markerLost', () => {
          banner.textContent = 'Point your camera at the Hiro marker';
          banner.classList.remove('found');
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">

  <div id="status">Point your camera at the Hiro marker</div>

  <a-scene embedded
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;"
           cursor="rayOrigin: mouse; fuse: false"
           raycaster="objects: .clickable">

    <!-- 3D model (Requirement 3) - CC0, credited in README -->
    <a-assets>
      <a-asset-item id="avocado"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Avocado/glTF-Binary/Avocado.glb">
      </a-asset-item>
    </a-assets>

    <a-marker preset="hiro" marker-status>

      <!-- Gallery floor -->
      <a-plane position="0 0 0" rotation="-90 0 0"
               width="1.6" height="1.6" color="#2C3E50"></a-plane>

      <!-- Display plinth -->
      <a-box position="0 0.2 0" width="0.6" height="0.4" depth="0.6"
             color="#ECF0F1"></a-box>

      <!-- The exhibit: avocado model, slowly rotating (Animation 1: rotation) -->
      <a-entity gltf-model="#avocado"
                position="0 0.42 0"
                scale="8 8 8"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-entity>

      <!-- Two gallery columns -->
      <a-cylinder position="-0.65 0.5 -0.55" radius="0.07" height="1"
                  color="#BDC3C7"></a-cylinder>
      <a-cylinder position="0.65 0.5 -0.55" radius="0.07" height="1"
                  color="#BDC3C7"></a-cylinder>

      <!-- Beam across the columns with the gallery name -->
      <a-box position="0 1.04 -0.55" width="1.5" height="0.1" depth="0.15"
             color="#8E6E53"></a-box>
      <a-text value="THE AVOCADO GALLERY" position="0 1.04 -0.47"
              align="center" width="1.8" color="#FFFFFF"></a-text>

      <!-- Floating ball: bobs up and down (Animation 2: position)
           and changes colour when tapped (workshop interaction) -->
      <a-sphere class="clickable"
                position="0.5 0.25 0.45" radius="0.12" color="#EF2D5E"
                color-change
                animation="property: position; to: 0.5 0.45 0.45; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine">
      </a-sphere>

      <!-- Info button: tap to show / hide the info panel (my own component) -->
      <a-cylinder class="clickable"
                  position="-0.5 0.05 0.45" radius="0.12" height="0.1"
                  color="#F39C12"
                  toggle-target="target: #infoPanel"></a-cylinder>
      <a-text value="Tap for info" position="-0.5 0.2 0.45"
              align="center" width="1.2" color="#FFFFFF"></a-text>

      <!-- Info panel (hidden until the button is tapped) -->
      <a-entity id="infoPanel" position="0 1.4 0" visible="false">
        <a-plane width="1.3" height="0.4" color="#000000" opacity="0.7"></a-plane>
        <a-text value="Persea americana (Avocado)\nNative to Central America.\nTap the button again to close."
                align="center" width="1.3" color="#FFFFFF" position="0 0 0.01"></a-text>
      </a-entity>

    </a-marker>

    <!-- The camera = your webcam / phone camera -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
